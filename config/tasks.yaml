story_task:
  description: >-
    주제: '{topic}'를 바탕으로 15초 내외의 단편 영상을 위한 3~4개의 연속된 씬(Scene)을 기획하세요.
    각 씬마다 피사체, 주변 환경, 카메라 무빙(예: 줌인, 슬로우 패닝, 트래킹 샷, 로우 앵글)을 시각적으로 구체적으로 묘사하세요.
  expected_output: >-
    3~4개의 씬으로 분할된 상세 시각 스토리보드 (각 씬의 시각 묘사 및 카메라 디렉팅 포함)
  agent: story_writer

prompt_task:
  description: >-
    스토리 태스크(story_task)의 각 씬을 오픈소스 AnimateDiff/Stable Diffusion에 최적화된 영문 프롬프트로 변환하세요.
    - 영문 포지티브 프롬프트(prompt): 피사체, 동작, 배경 조명, 카메라 앵글, 그리고 품질 태그(photorealistic, cinematic lighting, 4k, 8k resolution, highly detailed, smooth motion, masterwork)를 포함하세요.
    - 영문 네거티브 프롬프트(negative_prompt): 품질 저하 및 왜곡을 방지하는 키워드(blurry, deformed, flickering, low quality, bad anatomy, text, watermark, bad hands, cartoon)를 일관되게 포함하세요.
  expected_output: >-
    씬별 영문 포지티브(prompt) 및 네거티브(negative_prompt) 프롬프트 목록
  agent: prompt_director

export_task:
  description: >-
    생성된 프롬프트 데이터를 Colab 배치 실행 스크립트가 직접 읽을 수 있는 표준 JSON 형식으로 정리하여 'scenes.json' 파일에 출력하세요.
    모든 프롬프트는 영문이어야 하며 다음 스키마를 엄격히 준수해야 합니다:
    [
      {
        "scene_id": 1,
        "file_name": "scene_01.mp4",
        "prompt": "A cinematic shot of ...",
        "negative_prompt": "blurry, deformed, flickering, low quality",
        "num_frames": 16,
        "guidance_scale": 7.5,
        "num_inference_steps": 25
      }
    ]
    다른 설명 문구나 마크다운 코드블록 없이 순수 JSON 배열만 출력해야 합니다.
  expected_output: >-
    Colab 파이프라인 실행용 scenes.json 포맷의 순수 JSON 문자열
  agent: pipeline_dispatcher
  output_file: "scenes.json"
